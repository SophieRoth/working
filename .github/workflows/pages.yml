name: Update and Deploy Work Hours Dashboard

on:
  schedule:
    # GitHub Actions schedules use UTC. This runs at 12pm and 10pm Eastern during daylight saving time.
    - cron: "0 16,2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate dashboards
        run: python work_hours_dashboard.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_START_PROPERTY: ${{ vars.NOTION_START_PROPERTY }}
          NOTION_END_PROPERTY: ${{ vars.NOTION_END_PROPERTY }}
          NOTION_HOURS_PROPERTY: ${{ vars.NOTION_HOURS_PROPERTY }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
